AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LiteLLM Gateway - Ops 独立模块 (4): VPC Flow Logs → S3(取证) + NAT 出站字节量异常告警。
  自有 Flow Logs 补足 GuardDuty(GuardDuty 内部另有独立流日志做检测，不落本账号)：
  提供原始连接记录用于事后溯源"外传到哪、多少字节、什么时段"。
  NAT 出站字节异常检测为数据外泄提供实时信号，复用 monitoring 栈的 SNS 通道。

Parameters:
  ProjectName:
    Type: String
    Default: litellm-gw
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
  RetentionDays:
    Type: Number
    Default: 90
    Description: Flow Logs 在 S3 的保留天数
  MaxAggregationInterval:
    Type: Number
    Default: 600
    AllowedValues: [60, 600]
    Description: Flow Logs 聚合窗口秒（60 更细但量更大）
  NatGatewayId1:
    Type: String
    Default: ""
    Description: NAT 网关 1（出站字节异常告警；留空则不建）
  NatGatewayId2:
    Type: String
    Default: ""
    Description: NAT 网关 2（可选）
  NatEgressBurstThresholdBytes:
    Type: Number
    Default: 104857600
    MinValue: 10485760
    MaxValue: 107374182400
    Description: >
      NAT 单 5 分钟出站字节阈值（默认 100MB），连续 2 周期超过才告警。
      与小时阈值互补：小时告警要 2 小时才响，抓不到"20 分钟拉走 2GB"的短时突发。
      实测 5 分钟峰值 ~9MB，100MB 有 10 倍余量。
  NatEgressThresholdBytes:
    Type: Number
    Default: 524288000
    MinValue: 10485760
    MaxValue: 107374182400
    Description: >
      NAT 单小时出站字节固定阈值（默认 500MB），连续 2 小时超过才告警（≈持续 1GB+ 外泄）。
      不用异常检测：Bedrock 走 VPC Endpoint 不过 NAT，NAT 闲时基线趋零（~0.5MB/h），
      偶发镜像拉取即达基线百倍，任何标准差带都会持续误报（stdev=10 实测仍每天数十次翻转）。
      实测 14 天小时峰值 ~45MB，500MB 有 10 倍余量；客户上线后按实际峰值×10 校准。

Conditions:
  HasNat1: !Not [!Equals [!Ref NatGatewayId1, ""]]
  HasNat2: !Not [!Equals [!Ref NatGatewayId2, ""]]

Resources:
  # ---- Flow Logs 落地桶 ----
  FlowLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-ops-flowlogs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays

  FlowLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FlowLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal: { Service: delivery.logs.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${FlowLogsBucket}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSLogDeliveryCheck
            Effect: Allow
            Principal: { Service: delivery.logs.amazonaws.com }
            Action: [s3:GetBucketAcl, s3:ListBucket]
            Resource: !Sub "arn:aws:s3:::${FlowLogsBucket}"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---- VPC Flow Log（自定义字段，含 pkt-srcaddr/flow-direction/traffic-path 便于取证）----
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogsBucketPolicy
    Properties:
      ResourceId: !ImportValue { "Fn::Sub": "${ProjectName}-VpcId" }
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: s3
      LogDestination: !GetAtt FlowLogsBucket.Arn
      MaxAggregationInterval: !Ref MaxAggregationInterval
      LogFormat: "${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start} ${end} ${action} ${log-status} ${vpc-id} ${subnet-id} ${instance-id} ${tcp-flags} ${type} ${pkt-srcaddr} ${pkt-dstaddr} ${az-id} ${flow-direction} ${traffic-path}"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ops-vpc-flowlog"

  # ---- NAT 出站字节量固定阈值（数据外泄实时信号；不发 OK 通知，避免翻转噪音）----
  NatEgressHigh1:
    Type: AWS::CloudWatch::Alarm
    Condition: HasNat1
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-nat1-egress-high"
      AlarmDescription: "NAT1 出站流量持续偏高（疑似数据外泄/异常出站）"
      Namespace: AWS/NATGateway
      MetricName: BytesOutToDestination
      Dimensions:
        - Name: NatGatewayId
          Value: !Ref NatGatewayId1
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref NatEgressThresholdBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${ProjectName}-ops-AlertTopicArn" }]

  NatEgressBurst1:
    Type: AWS::CloudWatch::Alarm
    Condition: HasNat1
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-nat1-egress-burst"
      AlarmDescription: "NAT1 出站流量短时突发（疑似快速批量外泄）"
      Namespace: AWS/NATGateway
      MetricName: BytesOutToDestination
      Dimensions:
        - Name: NatGatewayId
          Value: !Ref NatGatewayId1
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref NatEgressBurstThresholdBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${ProjectName}-ops-AlertTopicArn" }]

  NatEgressHigh2:
    Type: AWS::CloudWatch::Alarm
    Condition: HasNat2
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-nat2-egress-high"
      AlarmDescription: "NAT2 出站流量持续偏高（疑似数据外泄/异常出站）"
      Namespace: AWS/NATGateway
      MetricName: BytesOutToDestination
      Dimensions:
        - Name: NatGatewayId
          Value: !Ref NatGatewayId2
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref NatEgressThresholdBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${ProjectName}-ops-AlertTopicArn" }]

  NatEgressBurst2:
    Type: AWS::CloudWatch::Alarm
    Condition: HasNat2
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-nat2-egress-burst"
      AlarmDescription: "NAT2 出站流量短时突发（疑似快速批量外泄）"
      Namespace: AWS/NATGateway
      MetricName: BytesOutToDestination
      Dimensions:
        - Name: NatGatewayId
          Value: !Ref NatGatewayId2
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref NatEgressBurstThresholdBytes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${ProjectName}-ops-AlertTopicArn" }]

Outputs:
  FlowLogsBucketName:
    Value: !Ref FlowLogsBucket
    Description: "Flow Logs S3 桶；用 setup-flowlogs-athena.sh 建取证表"
    Export:
      Name: !Sub "${ProjectName}-ops-FlowLogsBucket"
