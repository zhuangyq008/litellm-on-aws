AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LiteLLM Gateway - Ops 独立模块 (2/2): Regional WAF WebACL 关联 ALB。
  管理路径 IP 白名单（限制 master key 管理操作）+ rate-based 异常流量拦截 +
  AWS 托管规则 + 可选 Geo 白名单 + WAF 日志 + BlockedRequests 告警。
  通过独立的 WebACLAssociation 挂载，卸载本栈不影响 ALB 本体。

Parameters:
  ProjectName:
    Type: String
    Default: litellm-gw
  EnableAdminLockdown:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: 是否启用管理路径 IP 白名单（限制 master key 管理操作）；false 时不创建 IPSet 与锁定规则
  AllowedAdminCidrs:
    Type: CommaDelimitedList
    Default: "0.0.0.0/32"
    Description: 管理操作允许的源 IPv4 CIDR 列表（EnableAdminLockdown=true 时生效，如 203.0.113.10/32,198.51.100.0/24）
  RateLimitPerKey:
    Type: Number
    Default: 3000
    MinValue: 100
    Description: >
      单个 API key 5 分钟内请求上限（按 Authorization / x-api-key 头聚合），超出自动 BLOCK。
      这是主限速手段：遏制单个被盗/滥用 key，而非按出口 IP 误伤共享 NAT 的整个企业。
      应设为「单个重度用户（如 Claude Code）5 分钟峰值请求量」的若干倍。客户按实际用量调整。
  RateLimitPerIp:
    Type: Number
    Default: 20000
    MinValue: 100
    Description: >
      单个源 IP 5 分钟内请求上限（DoS 兜底 + 覆盖无鉴权头的洪泛）。2000+ 员工常共享公司出口
      NAT IP，此值须显著高于「整个公司从单一出口 IP 的 5 分钟峰值请求量」，否则会误杀正常流量。
      客户按实际出口 QPS 设定；无数据时先给高值，观察 Dashboard 请求量基线后再收紧。
  EnableGeoBlock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: 是否启用区域白名单（仅放行 AllowedCountries）
  AllowedCountries:
    Type: CommaDelimitedList
    Default: "CN"
    Description: 区域白名单 ISO 国家码（EnableGeoBlock=true 时生效）
  AlertTopicArn:
    Type: String
    Default: ""
    Description: monitoring 栈输出的 SNS 主题 ARN；填了才创建 WAF BlockedRequests 告警
  WafBlockedThreshold:
    Type: Number
    Default: 200
    Description: 5min 内 WAF 拦截数阈值（激增=攻击/滥用）

Conditions:
  HasGeo: !Equals [!Ref EnableGeoBlock, "true"]
  HasAdminLockdown: !Equals [!Ref EnableAdminLockdown, "true"]
  HasAlertTopic: !Not [!Equals [!Ref AlertTopicArn, ""]]

Resources:
  # --- 管理操作 IP 白名单（仅 EnableAdminLockdown=true 时创建）---
  AdminAllowIpSet:
    Type: AWS::WAFv2::IPSet
    Condition: HasAdminLockdown
    Properties:
      Name: !Sub "${ProjectName}-ops-admin-allowlist"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Ref AllowedAdminCidrs

  # --- WAF 日志目标（名字必须以 aws-waf-logs- 开头）---
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "aws-waf-logs-${ProjectName}-ops"
      RetentionInDays: 90

  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-ops-acl"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}OpsAcl"
      Rules:
        # 区域白名单（可选，最高优先级）
        - !If
          - HasGeo
          - Name: GeoAllowlist
            Priority: 5
            Action:
              Block: {}
            Statement:
              NotStatement:
                Statement:
                  GeoMatchStatement:
                    CountryCodes: !Ref AllowedCountries
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "${ProjectName}GeoAllowlist"
          - !Ref "AWS::NoValue"

        # AWS 托管规则组
        - Name: AWSCommon
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # LLM 网关（尤其 Claude Code 这类代码 agent）的请求体特征会误触发以下子规则，
              # 全部改为 Count（仅计数不拦截），保留组内其余攻击防护：
              #  - SizeRestrictions_BODY：body 远大于 8KB（system prompt + 工具定义 + 上下文）
              #  - GenericLFI_BODY：body 内含大量文件路径(../、/etc/ 等)被误判为本地文件包含攻击
              #  - CrossSiteScripting_BODY：代码/HTML 片段被误判为 XSS
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
                - Name: GenericLFI_BODY
                  ActionToUse:
                    Count: {}
                - Name: CrossSiteScripting_BODY
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}Common"

        - Name: AWSKnownBadInputs
          Priority: 11
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}KnownBad"

        - Name: AWSIpReputation
          Priority: 12
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}IpRep"

        # 管理路径锁定：命中管理路径 且 源 IP 不在白名单 -> BLOCK
        # （限制 master key 的管理操作只能从白名单 IP 发起）
        - !If
          - HasAdminLockdown
          - Name: AdminPathLockdown
            Priority: 20
            Action:
              Block: {}
            Statement:
              AndStatement:
                Statements:
                  - OrStatement:
                      Statements:
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/key"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/user"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/team"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/organization"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/model/new"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/model/update"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/model/delete"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/config"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/ui"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/spend"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/global"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  - NotStatement:
                      Statement:
                        IPSetReferenceStatement:
                          Arn: !GetAtt AdminAllowIpSet.Arn
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "${ProjectName}AdminLockdown"
          - !Ref "AWS::NoValue"

        # 异常流量 1/3：按 API key 限速（Authorization: Bearer 头）——主限速
        # 按 key 聚合，避免 2000+ 员工共享公司出口 NAT IP 时被按 IP 限速误杀。
        # 无该头的请求不计入本规则（由下方 IP 兜底规则覆盖）。
        - Name: RateLimitPerKeyAuth
          Priority: 30
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerKey
              AggregateKeyType: CUSTOM_KEYS
              CustomKeys:
                - Header:
                    Name: authorization
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
          # 关闭采样：RedactedFields 只脱敏日志目标、不脱敏 Sampled Requests，
          # 按鉴权头聚合时采样会露出 API key 明文。指标(CloudWatchMetrics)仍保留。
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}RateLimitKeyAuth"

        # 异常流量 2/3：按 API key 限速（x-api-key 头）——Anthropic 原生客户端(如 Claude Code)
        # 走 x-api-key 而非 Authorization，单独一条规则覆盖，否则这类流量将不受按-key 限速。
        - Name: RateLimitPerKeyApiKey
          Priority: 31
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerKey
              AggregateKeyType: CUSTOM_KEYS
              CustomKeys:
                - Header:
                    Name: x-api-key
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
          # 同上：关闭采样避免 x-api-key 明文出现在 Sampled Requests
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}RateLimitKeyApiKey"

        # 异常流量 3/3：按源 IP 限速（DoS 兜底 + 覆盖无鉴权头的洪泛）——高阈值避免误杀共享出口 IP
        - Name: RateLimitPerIp
          Priority: 32
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerIp
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}RateLimitIp"

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !ImportValue { "Fn::Sub": "${ProjectName}-ALBArn" }
      WebACLArn: !GetAtt WebACL.Arn

  WafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebACL.Arn
      LogDestinationConfigs:
        - !GetAtt WafLogGroup.Arn
      # 脱敏鉴权头，避免客户 API key 落入 WAF 日志
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: x-api-key

  # --- WAF 拦截激增告警（复用 monitoring 栈的 SNS 主题）---
  WafBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertTopic
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-waf-blocked-spike"
      AlarmDescription: "WAF 拦截量激增，疑似攻击/滥用"
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub "${ProjectName}-ops-acl"
        - Name: Rule
          Value: ALL
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref WafBlockedThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]
      OKActions: [!Ref AlertTopicArn]

Outputs:
  WebACLArn:
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub "${ProjectName}-ops-WebACLArn"
  AdminAllowIpSetId:
    Condition: HasAdminLockdown
    Value: !GetAtt AdminAllowIpSet.Id
    Description: "管理白名单 IPSet ID（维护白名单用）"
