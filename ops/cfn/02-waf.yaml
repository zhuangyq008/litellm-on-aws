AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LiteLLM Gateway - Ops 独立模块 (2/2): Regional WAF WebACL 关联 ALB。
  管理路径 IP 白名单（限制 master key 管理操作）+ rate-based 异常流量拦截 +
  AWS 托管规则 + 可选 Geo 白名单 + WAF 日志 + BlockedRequests 告警。
  通过独立的 WebACLAssociation 挂载，卸载本栈不影响 ALB 本体。

Parameters:
  ProjectName:
    Type: String
    Default: litellm-gw
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    Description: 项目名；用于构造指标命名空间与指标名，非法字符会导致告警指标错位而永不触发
  EnableAdminLockdown:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: 是否启用管理路径 IP 白名单（限制 master key 管理操作）；false 时不创建 IPSet 与锁定规则
  AllowedAdminCidrs:
    Type: CommaDelimitedList
    Default: "0.0.0.0/32"
    Description: 管理操作允许的源 IPv4 CIDR 列表（EnableAdminLockdown=true 时生效，如 203.0.113.10/32,198.51.100.0/24）
  RateLimitPerKey:
    Type: Number
    Default: 3000
    MinValue: 100
    Description: >
      单个 API key 5 分钟内请求上限（按 Authorization / x-api-key 头聚合），超出自动 BLOCK。
      这是主限速手段：遏制单个被盗/滥用 key，而非按出口 IP 误伤共享 NAT 的整个企业。
      应设为「单个重度用户（如 Claude Code）5 分钟峰值请求量」的若干倍。客户按实际用量调整。
  RateLimitPerIp:
    Type: Number
    Default: 20000
    MinValue: 100
    Description: >
      单个源 IP 5 分钟内请求上限（DoS 兜底 + 覆盖无鉴权头的洪泛）。2000+ 员工常共享公司出口
      NAT IP，此值须显著高于「整个公司从单一出口 IP 的 5 分钟峰值请求量」，否则会误杀正常流量。
      客户按实际出口 QPS 设定；无数据时先给高值，观察 Dashboard 请求量基线后再收紧。
  EnableGeoBlock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: 是否启用区域白名单（仅放行 AllowedCountries）
  AllowedCountries:
    Type: CommaDelimitedList
    Default: "CN"
    Description: 区域白名单 ISO 国家码（EnableGeoBlock=true 时生效）
  AlertTopicArn:
    Type: String
    Default: ""
    Description: monitoring 栈输出的 SNS 主题 ARN；填了才创建 WAF BlockedRequests 告警
  WafBlockedThreshold:
    Type: Number
    Default: 5000
    MinValue: 100
    Description: >
      单小时 WAF 拦截总数阈值（L7 洪水量级信号）。⚠️ 这不是「有攻击」告警：暴露在公网的 ALB
      每天被扫描器拦下数千次是常态（实测 14 天 34k 次，71% 是 Geo 白名单挡掉的境外扫描，
      其余为 /.env、/.git/config 等通用探测），按 5min/200 告警等于给互联网背景噪声告警。
      本阈值只用于识别「量级异常」，实测小时峰值 3446，取 5000 留余量。客户按实测小时峰值×1.5 校准。
  WafRateLimitBlockThreshold:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      5min 内被 rate-based 规则拦下的请求数阈值（0=一旦触发即告警）。这是真正可行动的信号：
      说明某个 API key 被滥用/盗用，或单一源 IP 在打洪泛。实测 14 天为 0，故设为绊线。
      若客户上线后存在合法的团队共享 key 撞限速，先调高本值并推动拆分 key，而不是关掉告警。
  WafApiPathBlockThreshold:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      5min 内「真实推理端点」被拦下的请求数阈值（0=一旦发生即告警）。只统计 /v1/messages、
      /v1/chat/completions 等实际业务路径，且排除 Geo 白名单命中（境外扫描器也会探这些路径）。
      命中即意味着：托管规则误杀了客户端（历史踩过 3 次子规则误杀 Claude Code），或攻击者带着
      凭证打业务接口。实测 14 天为 0。

Conditions:
  HasGeo: !Equals [!Ref EnableGeoBlock, "true"]
  HasAdminLockdown: !Equals [!Ref EnableAdminLockdown, "true"]
  HasAlertTopic: !Not [!Equals [!Ref AlertTopicArn, ""]]

Resources:
  # --- 管理操作 IP 白名单（仅 EnableAdminLockdown=true 时创建）---
  AdminAllowIpSet:
    Type: AWS::WAFv2::IPSet
    Condition: HasAdminLockdown
    Properties:
      Name: !Sub "${ProjectName}-ops-admin-allowlist"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Ref AllowedAdminCidrs

  # --- WAF 日志目标（名字必须以 aws-waf-logs- 开头）---
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "aws-waf-logs-${ProjectName}-ops"
      RetentionInDays: 90

  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-ops-acl"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}OpsAcl"
      Rules:
        # 区域白名单（可选，最高优先级）
        - !If
          - HasGeo
          - Name: GeoAllowlist
            Priority: 5
            Action:
              Block: {}
            Statement:
              NotStatement:
                Statement:
                  GeoMatchStatement:
                    CountryCodes: !Ref AllowedCountries
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "${ProjectName}GeoAllowlist"
          - !Ref "AWS::NoValue"

        # AWS 托管规则组
        - Name: AWSCommon
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # LLM 网关（尤其 Claude Code 这类代码 agent）的请求体特征会误触发以下子规则，
              # 全部改为 Count（仅计数不拦截），保留组内其余攻击防护：
              #  - SizeRestrictions_BODY：body 远大于 8KB（system prompt + 工具定义 + 上下文）
              #  - GenericLFI_BODY：body 内含大量文件路径(../、/etc/ 等)被误判为本地文件包含攻击
              #  - CrossSiteScripting_BODY：代码/HTML 片段被误判为 XSS
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
                - Name: GenericLFI_BODY
                  ActionToUse:
                    Count: {}
                - Name: CrossSiteScripting_BODY
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}Common"

        - Name: AWSKnownBadInputs
          Priority: 11
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}KnownBad"

        - Name: AWSIpReputation
          Priority: 12
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}IpRep"

        # 管理路径锁定：命中管理路径 且 源 IP 不在白名单 -> BLOCK
        # （限制 master key 的管理操作只能从白名单 IP 发起）
        - !If
          - HasAdminLockdown
          - Name: AdminPathLockdown
            Priority: 20
            Action:
              Block: {}
            Statement:
              AndStatement:
                Statements:
                  - OrStatement:
                      Statements:
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/key"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/user"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/team"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/organization"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/model/new"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/model/update"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/model/delete"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/config"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/ui"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/spend"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: "/global"
                            TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  - NotStatement:
                      Statement:
                        IPSetReferenceStatement:
                          Arn: !GetAtt AdminAllowIpSet.Arn
            VisibilityConfig:
              SampledRequestsEnabled: true
              CloudWatchMetricsEnabled: true
              MetricName: !Sub "${ProjectName}AdminLockdown"
          - !Ref "AWS::NoValue"

        # 异常流量 1/3：按 API key 限速（Authorization: Bearer 头）——主限速
        # 按 key 聚合，避免 2000+ 员工共享公司出口 NAT IP 时被按 IP 限速误杀。
        # 无该头的请求不计入本规则（由下方 IP 兜底规则覆盖）。
        - Name: RateLimitPerKeyAuth
          Priority: 30
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerKey
              AggregateKeyType: CUSTOM_KEYS
              CustomKeys:
                - Header:
                    Name: authorization
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
          # 关闭采样：RedactedFields 只脱敏日志目标、不脱敏 Sampled Requests，
          # 按鉴权头聚合时采样会露出 API key 明文。指标(CloudWatchMetrics)仍保留。
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}RateLimitKeyAuth"

        # 异常流量 2/3：按 API key 限速（x-api-key 头）——Anthropic 原生客户端(如 Claude Code)
        # 走 x-api-key 而非 Authorization，单独一条规则覆盖，否则这类流量将不受按-key 限速。
        - Name: RateLimitPerKeyApiKey
          Priority: 31
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerKey
              AggregateKeyType: CUSTOM_KEYS
              CustomKeys:
                - Header:
                    Name: x-api-key
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
          # 同上：关闭采样避免 x-api-key 明文出现在 Sampled Requests
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}RateLimitKeyApiKey"

        # 异常流量 3/3：按源 IP 限速（DoS 兜底 + 覆盖无鉴权头的洪泛）——高阈值避免误杀共享出口 IP
        - Name: RateLimitPerIp
          Priority: 32
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerIp
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}RateLimitIp"

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !ImportValue { "Fn::Sub": "${ProjectName}-ALBArn" }
      WebACLArn: !GetAtt WebACL.Arn

  WafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebACL.Arn
      LogDestinationConfigs:
        - !GetAtt WafLogGroup.Arn
      # 脱敏鉴权头，避免客户 API key 落入 WAF 日志
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: x-api-key

  # --- 「真实推理端点被拦」指标（从 WAF 日志抽取）---
  # WAF 只按规则维度出指标，拿不到 URI 维度；而"拦截总量"里 99% 是扫描器噪声。
  # 用日志 metric filter 精确到业务路径 + 排除 Geo 命中，把噪声压到零、只留可行动信号。
  # 路径用精确匹配而非 /v1* 前缀：扫描器大量探测 /v1/.env、/v1/models、/v1/graphql，
  # 前缀匹配会把它们算进来（实测 14 天前缀口径 ~100 次、精确口径 0 次）。
  ApiPathBlockedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WafLogGroup
      # LiteLLM 对每个端点同时注册带 /v1 前缀和不带前缀两种路由，两种都要列，
      # 否则走无前缀路由的客户端被误杀时告警沉默。
      FilterPattern: >-
        { $.action = "BLOCK" && $.terminatingRuleId != "GeoAllowlist" &&
        ($.httpRequest.uri = "/v1/messages" || $.httpRequest.uri = "/messages" ||
        $.httpRequest.uri = "/v1/chat/completions" || $.httpRequest.uri = "/chat/completions" ||
        $.httpRequest.uri = "/v1/completions" || $.httpRequest.uri = "/completions" ||
        $.httpRequest.uri = "/v1/embeddings" || $.httpRequest.uri = "/embeddings" ||
        $.httpRequest.uri = "/v1/responses" || $.httpRequest.uri = "/responses") }
      MetricTransformations:
        - MetricNamespace: !Sub "${ProjectName}/waf"
          MetricName: ApiPathBlockedRequests
          MetricValue: "1"
          DefaultValue: 0

  # --- WAF 告警（复用 monitoring 栈的 SNS 主题）---
  # 三个告警分工：量级洪水(小时) / key 滥用(绊线) / 业务路径误杀或凭证攻击(绊线)。
  # 均不配 OKActions：扫描爆发或限速触发的「已恢复」不是事件，通知一次足够，
  # 否则每次事件推 2 条消息，反而制造告警疲劳。
  WafBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertTopic
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-waf-blocked-flood"
      AlarmDescription: "WAF 单小时拦截量达洪水量级（远超扫描器背景噪声），疑似 L7 洪泛"
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub "${ProjectName}-ops-acl"
        - Name: Rule
          Value: ALL
        - Name: Region
          Value: !Ref AWS::Region
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref WafBlockedThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]

  # 限速规则被触发 = 某个 key 被滥用/盗用，或单 IP 洪泛。三条 rate 规则合并统计。
  WafRateLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertTopic
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-waf-ratelimit-triggered"
      AlarmDescription: "WAF 限速规则拦截了请求：单个 API key 被滥用/盗用，或单一源 IP 洪泛"
      EvaluationPeriods: 1
      Threshold: !Ref WafRateLimitBlockThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]
      Metrics:
        - Id: auth
          MetricStat:
            Metric:
              Namespace: AWS/WAFV2
              MetricName: BlockedRequests
              Dimensions:
                - Name: WebACL
                  Value: !Sub "${ProjectName}-ops-acl"
                - Name: Rule
                  Value: !Sub "${ProjectName}RateLimitKeyAuth"
                - Name: Region
                  Value: !Ref AWS::Region
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: apikey
          MetricStat:
            Metric:
              Namespace: AWS/WAFV2
              MetricName: BlockedRequests
              Dimensions:
                - Name: WebACL
                  Value: !Sub "${ProjectName}-ops-acl"
                - Name: Rule
                  Value: !Sub "${ProjectName}RateLimitKeyApiKey"
                - Name: Region
                  Value: !Ref AWS::Region
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: ip
          MetricStat:
            Metric:
              Namespace: AWS/WAFV2
              MetricName: BlockedRequests
              Dimensions:
                - Name: WebACL
                  Value: !Sub "${ProjectName}-ops-acl"
                - Name: Rule
                  Value: !Sub "${ProjectName}RateLimitIp"
                - Name: Region
                  Value: !Ref AWS::Region
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: "SUM([FILL(auth,0),FILL(apikey,0),FILL(ip,0)])"
          Label: "限速拦截合计"
          ReturnData: true

  WafApiPathBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertTopic
    Properties:
      AlarmName: !Sub "${ProjectName}-ops-waf-api-path-blocked"
      AlarmDescription: "真实推理端点的请求被 WAF 拦下：托管规则误杀客户端，或攻击者在打业务接口"
      Namespace: !Sub "${ProjectName}/waf"
      MetricName: ApiPathBlockedRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref WafApiPathBlockThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopicArn]

Outputs:
  WebACLArn:
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub "${ProjectName}-ops-WebACLArn"
  AdminAllowIpSetId:
    Condition: HasAdminLockdown
    Value: !GetAtt AdminAllowIpSet.Id
    Description: "管理白名单 IPSet ID（维护白名单用）"
