AWSTemplateFormatVersion: "2010-09-09"
Description: "litellm-gw: ACM certificate for aigw.enginez.link (DNS-validated via Route53)"

Parameters:
  ProjectName:
    Type: String
    Default: litellm-gw
  DomainName:
    Type: String
    Default: aigw.enginez.link
  HostedZoneId:
    Type: String
    Default: Z02143651SAMMZ86KXSGV
    Description: Route53 hosted zone ID for enginez.link

Resources:
  AlbCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  AlbCertificateArn:
    Description: ACM certificate ARN for ALB HTTPS listener
    Value: !Ref AlbCertificate
    Export:
      Name: !Sub "${ProjectName}-AlbCertificateArn"
  AlbDomainName:
    Description: Domain name covered by the certificate
    Value: !Ref DomainName
    Export:
      Name: !Sub "${ProjectName}-AlbDomainName"
