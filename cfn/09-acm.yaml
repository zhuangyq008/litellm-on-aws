AWSTemplateFormatVersion: "2010-09-09"
Description: "litellm-gw: ACM certificate for the gateway domain (DNS-validated via Route53)"

Parameters:
  ProjectName:
    Type: String
    Default: litellm-gw
  # No defaults: both must be supplied at deploy time so this template carries
  # no account-specific resource identifiers.
  DomainName:
    Type: String
    Description: "Fully qualified domain name for the gateway (e.g. gw.example.com)"
    AllowedPattern: "^[a-z0-9.-]+\\.[a-z]{2,}$"
  HostedZoneId:
    Type: String
    Description: "Route53 public hosted zone ID that owns DomainName"
    AllowedPattern: "^Z[A-Z0-9]+$"

Resources:
  AlbCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  AlbCertificateArn:
    Description: ACM certificate ARN for ALB HTTPS listener
    Value: !Ref AlbCertificate
    Export:
      Name: !Sub "${ProjectName}-AlbCertificateArn"
  AlbDomainName:
    Description: Domain name covered by the certificate
    Value: !Ref DomainName
    Export:
      Name: !Sub "${ProjectName}-AlbDomainName"
